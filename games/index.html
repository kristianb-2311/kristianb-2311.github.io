<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Games</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
}

h1 {
  text-align: center;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: #222;
  border-radius: 12px;
  overflow: hidden;
  text-decoration: none;
  color: white;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  background: #333;
}

.title {
  text-align: center;
  padding: 10px;
}
</style>
</head>

<body>

<h1>My Games</h1>
<div class="grid" id="grid"></div>

<script>
async function loadFiles() {
  // haal directory HTML op
  const res = await fetch('./');
  const text = await res.text();

  // parse HTML
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'text/html');

  // pak alle links
  const links = [...doc.querySelectorAll('a')];

  // filter html files
  const htmlFiles = links
    .map(a => a.getAttribute('href'))
    .filter(href => href && href.endsWith('.html') && href !== 'index.html');

  // pak ook png lijst
  const files = links.map(a => a.getAttribute('href'));

  const grid = document.getElementById('grid');

  htmlFiles.forEach(file => {
    const base = file.replace('.html', '');
    const imgFile = base + '.png';

    const card = document.createElement('a');
    card.className = 'card';
    card.href = file;

    const img = document.createElement('img');
    img.src = files.includes(imgFile)
      ? imgFile
      : `https://via.placeholder.com/300x140?text=${base}`;

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = base;

    card.appendChild(img);
    card.appendChild(title);
    grid.appendChild(card);
  });
}

loadFiles();
</script>

</body>
</html>
