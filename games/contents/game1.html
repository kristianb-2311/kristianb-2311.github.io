<script>
const USER = "kristianb-2311";
const REPO = "games";
const PATH = ""; // root of repo

async function loadFiles() {
  const url = `https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`;

  const res = await fetch(url);
  const data = await res.json();

  const htmlFiles = data.filter(f => f.name.endsWith(".html") && f.name !== "index.html");

  const grid = document.getElementById("grid");

  htmlFiles.forEach(file => {
    const base = file.name.replace(".html", "");
    const img = base + ".png";

    const card = document.createElement("a");
    card.className = "card";
    card.href = file.name;

    const image = document.createElement("img");
    image.src = img;

    image.onerror = () => {
      image.src = `https://via.placeholder.com/300x140?text=${base}`;
    };

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = base;

    card.appendChild(image);
    card.appendChild(title);
    grid.appendChild(card);
  });
}

loadFiles();
</script>
